<div class="dashboard grid">
  <!-- Punch Clock -->
  <div class="col-12 xl:col-4">
    <app-punch-clock class="h-100"></app-punch-clock>
  </div>

  <!-- KPI Cards -->
  <div class="col-12 xl:col-8">
    <app-kpi-cards [items]="kpis"></app-kpi-cards>
  </div>

  <!-- Schedule (2/3 en ≥1200) -->
  <div class="col-12 xl:col-8">
    <app-schedule-overview
      [date]="today"
      [entries]="schedule"
    ></app-schedule-overview>
  </div>

  <!-- Pending Requests (1/3 en ≥1200) -->
  <div class="col-12 xl:col-4">
    <app-assign-task></app-assign-task>
  </div>

  <!-- Assign Task (fila completa) -->
  <div class="col-12">
    <app-pending-requests
      [requests]="requests"
      (approve)="onApproveRequest($event)"
      (reject)="onRejectRequest($event)"
    >
    </app-pending-requests>
  </div>
</div>
